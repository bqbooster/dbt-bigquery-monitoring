name: Pull Request testing - Run dbt Fusion models on BigQuery
on:
  pull_request:
    paths:
      - 'macros/**'
      - 'models/**'
      - 'integration_tests/**'
      - 'dbt_project.yml'
      - 'packages.yml'
      - 'config.py'
      - '.github/workflows/pr_run_models_fusion.yml'
      - '.github/workflows/fusion_bigquery_models.yml'
      - '.github/actions/setup-dbt/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: pr-run-models-fusion-${{ github.workflow }}-${{ github.ref }}

jobs:
  integration-bigquery-fusion:
    uses: ./.github/workflows/fusion_bigquery_models.yml
    secrets: inherit
