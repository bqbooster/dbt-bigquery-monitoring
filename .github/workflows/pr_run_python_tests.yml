name: Pull Request testing - Run Python validation tests
on:
  pull_request:
    paths:
      - 'tests/**'
      - 'integration_tests/**'
      - 'macros/**'
      - 'dbt_project.yml'
      - 'packages.yml'
      - '.github/workflows/pr_run_python_tests.yml'
      - '.github/actions/setup-dbt/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  cancel-in-progress: true
  group: pr-run-python-tests-${{ github.workflow }}-${{ github.ref }}

jobs:
  python-validation-tests:
    name: Run Python validation tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up dbt Core
        uses: ./.github/actions/setup-dbt
        with:
          with-pytest: "true"

      - name: Write keyfile if secret is defined
        run: |
          if [ -z "${{ secrets.DBT_ENV_SECRET_BIGQUERY_TEST_SERVICE_ACCOUNT }}" ]; then
            echo "Error: DBT_ENV_SECRET_BIGQUERY_TEST_SERVICE_ACCOUNT is not defined."
          else
            echo ${{ secrets.DBT_ENV_SECRET_BIGQUERY_TEST_SERVICE_ACCOUNT }} | base64 -d > ./integration_tests/keyfile.json
          fi

      - name: Install dbt dependencies
        run: |
          cd integration_tests
          dbt deps

      - name: Run Python validation tests
        run: python -m pytest tests/ -q
