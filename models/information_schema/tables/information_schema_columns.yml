version: 2
models:
- name: information_schema_columns
  columns:
  - name: table_catalog
    description: The project ID of the project that contains the dataset.
    data_type: STRING
  - name: table_schema
    description: "The name of the dataset that contains the table also referred to\
      \ as\n        the datasetId."
    data_type: STRING
  - name: table_name
    description: The name of the table or view also referred to as the tableId.
    data_type: STRING
  - name: column_name
    description: The name of the column.
    data_type: STRING
  - name: ordinal_position
    description: "The 1-indexed offset of the column within the table; if it's a pseudo\n\
      \        column such as _PARTITIONTIME or _PARTITIONDATE, the value is\n   \
      \     NULL."
    data_type: INT64
  - name: is_nullable
    description: "YES or NO depending on whether the column's\n        mode allows\
      \ NULL values."
    data_type: STRING
  - name: data_type
    description: The column's GoogleSQL data type.
    data_type: STRING
  - name: is_generated
    description: "The value is ALWAYS if the column is an\n        automatically\n\
      \        generated embedding column;\n        otherwise, the value is NEVER."
    data_type: STRING
  - name: generation_expression
    description: "The value is the generation expression used to define the column\n\
      \      if the column is an automatically\n      generated embedding column;\
      \ otherwise the value is NULL."
    data_type: STRING
  - name: is_stored
    description: "The value is YES if the column is an automatically\n      generated\
      \ embedding column; otherwise, the value is\n      NULL."
    data_type: STRING
  - name: async_generation_status
    description: "Contains blocking errors for background embedding generation jobs\
      \ if the\n        column is an automatically generated embedding column; otherwise,\
      \ the\n        value is NULL. For information about blocking errors, see\n \
      \       the async_generation_status.blocking_error.message field.\n        Blocking\
      \ errors can include the following:\n        \nPermission denied errors\nNot\
      \ found errors\nUnsupported embedding model endpoint errors\nVertex AI API not\
      \ enabled errors\n\n        Once the next embedding generation job succeeds,\
      \ the\n        async_generation_status column is cleared."
    data_type: STRUCT
  - name: is_hidden
    description: "YES or NO depending on whether the column is\n      a pseudo column\
      \ such as _PARTITIONTIME or _PARTITIONDATE."
    data_type: STRING
  - name: is_updatable
    description: The value is always NULL.
    data_type: STRING
  - name: is_system_defined
    description: "YES or NO depending on whether the column is\n      a pseudo column\
      \ such as _PARTITIONTIME or _PARTITIONDATE."
    data_type: STRING
  - name: is_partitioning_column
    description: "YES or NO depending on whether the column is\n        a partitioning\
      \ column."
    data_type: STRING
  - name: clustering_ordinal_position
    description: "The 1-indexed offset of the column within the table's\n        clustering\
      \ columns; the value is NULL if the table is not a\n        clustered table."
    data_type: INT64
  - name: collation_name
    description: "The name of the collation specification\n        if it exists; otherwise,\
      \ NULL.\n        If a STRING or ARRAY<STRING> is passed\n        in, the collation\
      \ specification is returned if it exists; otherwise\n        NULL is returned."
    data_type: STRING
  - name: column_default
    description: "The default value of the\n        column if it exists; otherwise,\
      \ the value is NULL."
    data_type: STRING
  - name: rounding_mode
    description: "The mode of rounding that's used for values written to the field\
      \ if its\n        type is a parameterized NUMERIC or BIGNUMERIC;\n        otherwise,\
      \ the value is NULL."
    data_type: STRING
  - name: data_governance_tags
    description: "The list of data\n        governance tags that are attached to the\
      \ column to control access\n        and masking. Each STRUCT contains the following\n\
      \        STRING fields:\n        \nkey: the namespaced tag key, in the format\n\
      \            PROJECT_ID/TAG_KEY or\n            ORGANIZATION_ID/TAG_KEY.\nvalue:\
      \ the short name of the tag value.\n\n        For STRUCT (or RECORD) columns,\
      \ data\n        governance tags that are attached to nested fields are available\
      \ in the\n        INFORMATION_SCHEMA.COLUMN_FIELD_PATHS\n        view."
    data_type: ARRAY<STRUCT>
  - name: policy_tags
    description: The list of policy tags that are attached to the column.
    data_type: ARRAY<STRING>
  - name: is_identity
    description: "YES or NO depending on whether the column is\n        an identity\
      \ column."
    data_type: STRING
  - name: identity_generation
    description: "One of ALWAYS or BY DEFAULT, depending on the\n        generation\
      \ mode of the identity column. If the column isn't an identity\n        column,\
      \ then the value is NULL."
    data_type: STRING
  - name: identity_start
    description: "The first value generated by the identity column, or NULL\n    \
      \    if the column isn't an identity column."
    data_type: INT64
  - name: identity_increment
    description: "The minimum difference between successively generated IDs for the\n\
      \        identity column, or NULL if the column isn't an\n        identity column."
    data_type: INT64
  - name: identity_maximum
    description: "The maximum value that can be generated for the identity column,\
      \ or\n        NULL if the column isn't an identity column."
    data_type: INT64
  - name: identity_minimum
    description: "The minimum value that can be generated for the identity column,\
      \ or\n        NULL if the column isn't an identity column."
    data_type: INT64
  - name: identity_cycle
    description: "If the column is an identity column, then this value is\n      \
      \  NEVER; otherwise, the value is NULL."
    data_type: STRING
  - name: data_policies
    description: 'data_policies.name : The list of data policies that are attached
      to the column to control access and masking. This field is in (Preview).'
    data_type: RECORD
