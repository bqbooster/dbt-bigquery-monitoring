version: 2

models:
  - name: most_repeated_jobs
    description: >
      Queries that ran more than once. Grouped by raw query text unless
      group_repeated_jobs_by_normalized_hash is true. With that var, rows are grouped
      by query_info.query_hashes.normalized_literals (raw text when the hash is null)
      and hourly totals are summed once per fingerprint. `query_fingerprint` and
      `normalized_query_hash` are always present and do not change the historical columns.
    config:
      meta:
        label: "Most Repeated Jobs"
        order_fields_by: "label"
        group_label: "Compute cost"
    columns:
      - name: query
        description: >
          The raw query text, or one example text when hash grouping is enabled.
      - name: project_ids
        description: The top aggregated project IDs.
      - name: reservation_ids
        description: The top aggregated reservation IDs.
      - name: user_emails
        description: The top aggregated user emails.
      - name: cache_hit_ratio
        description: The ratio of cache hits.
      - name: total_query_cost
        description: The total query cost.
      - name: total_slot_ms
        description: The total number of slot time milliseconds.
      - name: total_slot_time
        description: The total slot time in human-readable format.
      - name: query_count
        description: The total query count for the model.
      - name: query_fingerprint
        description: >
          normalized_literals when present, otherwise the raw query text.
          A null hash and a null query stay null and do not collapse other texts.
      - name: normalized_query_hash
        description: >
          The normalized_literals hash, or NULL when BigQuery did not provide one
          (cache hits, failures, non-GoogleSQL, audit-log-only mode).
